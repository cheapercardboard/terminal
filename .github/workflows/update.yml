name: Update prices

on:
  schedule:
    - cron: "30 21 * * *"   # daily, 21:30 UTC (TCGCSV refreshes around 20:00 UTC)
  workflow_dispatch:         # "Run workflow" button

permissions:
  contents: write            # saves data/history.json back to the repository
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # TCGCSV asks us to request each price file at most once per update (and once per 24 hours).
      # Its last-updated time names a cache of the price files, so a re-run of this workflow reuses them.
      - name: Ask TCGCSV when it last updated (used as the cache name)
        id: stamp
        run: echo "value=$(python collect_tcgcsv.py --print-stamp)" >> "$GITHUB_OUTPUT"
        env:
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
      - name: Reuse TCGCSV's price files if this update was already fetched
        uses: actions/cache@v4
        with:
          path: cache
          key: tcgcsv-prices-${{ steps.stamp.outputs.value }}

      - name: Collect prices (TCGCSV) and legality (Scryfall)
        id: collect
        run: python collect_tcgcsv.py
        env:
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}

      # If TCGCSV has nothing new and the saved price files are gone, the collector does nothing
      # and the steps below are skipped, so the site keeps showing the last published data.
      - name: Safety check (never publish an empty site)
        if: ${{ steps.collect.outputs.skipped != 'true' }}
        run: python -c "import json,sys; t=open('site/data.js',encoding='utf-8').read(); n=len(json.loads(t.split('window.MTG = ',1)[1].rsplit(';',1)[0])['cards']); print(n,'cards'); sys.exit(0 if n>=3000 else 1)"
      - name: Save the price history
        if: ${{ steps.collect.outputs.skipped != 'true' }}
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data/history.json
          git diff --cached --quiet || (git commit -m "Update price history" && git push)
      - uses: actions/configure-pages@v6
        if: ${{ steps.collect.outputs.skipped != 'true' }}
      - uses: actions/upload-pages-artifact@v5
        if: ${{ steps.collect.outputs.skipped != 'true' }}
        with:
          path: site
      - id: deployment
        if: ${{ steps.collect.outputs.skipped != 'true' }}
        uses: actions/deploy-pages@v5
